name: mazory
x-environment: &environment
  MAZORY_ENV: production
  SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set a separate JWT_SIGNING_KEY}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set a Fernet MFA key}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set the public hostname}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the HTTPS origin}
  CORS_ALLOWED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  POSTGRES_DB: ${POSTGRES_DB:-mazory_db}
  POSTGRES_USER: ${POSTGRES_USER:-mazory}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  REDIS_HOST: redis
  WAHA_API_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY:?Set the WAHA key}
  WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:?Set the webhook signing secret}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
  BITRIX_INBOUND_TOKEN: ${BITRIX_INBOUND_TOKEN:-}
  BITRIX_TEAM_ID: ${BITRIX_TEAM_ID:-0}
  BITRIX_STAGE_MAP: ${BITRIX_STAGE_MAP:-}
  PROVIDER_ALLOWED_HOSTS: ${PROVIDER_ALLOWED_HOSTS:-openrouter.ai}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set the vector database key}
  OCR_URL: ${OCR_URL:-}
  TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-}
  MEDIA_PROVIDER_KEY: ${MEDIA_PROVIDER_KEY:-}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-1000}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-20}
x-backend: &backend
  image: mazory-backend:${APP_TAG:-local}
  build: ./backend
  environment: *environment
  restart: unless-stopped
  init: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  volumes: [private_media:/app/media, static_files:/app/staticfiles]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  networks: [internal]
services:
  nginx:
    image: mazory-nginx:${APP_TAG:-local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports: ['127.0.0.1:18080:80']
    volumes: [static_files:/staticfiles:ro]
    depends_on: [backend]
    networks: [internal]
  backend:
    <<: *backend
    command: [gunicorn, mazory_backend.wsgi:application, --bind, '0.0.0.0:8000', --workers, '2', --timeout, '30', --max-requests, '1000', --max-requests-jitter, '100']
  qcluster:
    <<: *backend
    environment:
      <<: *environment
      Q_CLUSTER_NAME: ai
    command: [python, manage.py, qcluster]
  qcluster_delivery:
    <<: *backend
    environment:
      <<: *environment
      Q_CLUSTER_NAME: delivery
    command: [python, manage.py, qcluster]
  qcluster_history:
    <<: *backend
    environment:
      <<: *environment
      Q_CLUSTER_NAME: history
    command: [python, manage.py, qcluster]
  qcluster_crm:
    <<: *backend
    environment:
      <<: *environment
      Q_CLUSTER_NAME: crm
    command: [python, manage.py, qcluster]
  outbox:
    <<: *backend
    command: [python, manage.py, run_outbox]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mazory_db}
      POSTGRES_USER: ${POSTGRES_USER:-mazory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    networks: [internal]
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment: { QDRANT__SERVICE__API_KEY: '${QDRANT_API_KEY:?Set the vector database key}' }
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]
  waha:
    image: ${WAHA_IMAGE:?Set a pinned WAHA image tag or digest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?Set the WAHA key}
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      WHATSAPP_HOOK_URL: http://backend:8000/api/whatsapp/webhook/
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET:?Set the signing secret}
      WHATSAPP_HOOK_EVENTS: message,message.ack
      WAHA_LOG_LEVEL: warn
    volumes: [waha_sessions:/app/.sessions]
    networks: [internal]
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  waha_sessions:
  private_media:
  static_files:
networks:
  internal:
