name: mazory

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mazory-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/staticfiles:/app/staticfiles:ro
      - ./backend/media:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mazory-network

  certbot:
    image: certbot/certbot:latest
    container_name: mazory-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - mazory-network

  redis:
    image: redis:7-alpine
    container_name: mazory-redis
    restart: unless-stopped
    # Port is internal to mazory-network
    volumes:
      - redis_data:/data
    networks:
      - mazory-network

  postgres:
    image: postgres:16-alpine
    container_name: mazory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mazory_db}
      POSTGRES_USER: ${POSTGRES_USER:-mazory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mazory2026}
    # Bound to localhost only for host-level management scripts (not exposed externally)
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazory -d mazory_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mazory-network

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: mazory-qdrant
    restart: unless-stopped
    # Internal to mazory-network
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mazory-network

  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: mazory-waha
    restart: unless-stopped
    # Port 3000 is internal only. Managed solely via Django Admin (/admin/waha-dashboard/)
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_LOG_LEVEL=INFO
      - WAHA_LOG_FORMAT=JSON
      - WAHA_API_KEY=mazory-waha-key-2026
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=mazory2026
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=mazory2026
    volumes:
      - ./waha_sessions:/app/.sessions
    networks:
      - mazory-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mazory-backend
    restart: unless-stopped
    # Port 8000 is internal to mazory-network; routed through Nginx
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB:-mazory_db}
      - POSTGRES_USER=${POSTGRES_USER:-mazory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mazory2026}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=mazory-waha-key-2026
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: python manage.py runserver 0.0.0.0:8000
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - mazory-network

  qcluster:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mazory-qcluster
    restart: unless-stopped
    command: python manage.py qcluster
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB:-mazory_db}
      - POSTGRES_USER=${POSTGRES_USER:-mazory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mazory2026}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=mazory-waha-key-2026
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - mazory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mazory-frontend
    restart: unless-stopped
    # Port 5173 is internal to mazory-network; routed through Nginx
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - mazory-network

networks:
  mazory-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
