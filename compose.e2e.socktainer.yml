# Apple Container gives each container a VM. A writable disk image cannot be
# attached to several VMs; virtiofs bind mounts provide the shared E2E files.
# The original named volumes (including PostgreSQL) are never removed.
x-shared: &shared
  volumes: !override
    - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/fixtures:/e2e
    - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/static:/app/staticfiles
    - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/avatars:/app/avatars
    - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/container.marker:/.dockerenv:ro
services:
  provider:
    <<: *shared
    user: '${E2E_HOST_UID:-501}:${E2E_HOST_GID:-20}'
  seed: *shared
  backend: *shared
  qcluster: *shared
  outbox: *shared
  nginx:
    volumes: !override
      - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/static:/staticfiles:ro
      - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/avatars:/avatars:ro
    ports:
      - '127.0.0.1:18080:80'
  browser:
    volumes: !override
      - ${E2E_RUNTIME_DIR:-./.e2e-runtime}/fixtures:/e2e
volumes:
  database:
    name: ${E2E_DATABASE_VOLUME:-mazory-e2e_database}
