name: Platform verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, Django and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed sources for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck and build frontend
        run: npm run build
        working-directory: frontend
      - name: Frontend analytics regression tests
        run: npm test
        working-directory: frontend
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Django configuration and migration drift
        run: |
          uv run --project backend python backend/manage.py check
          uv run --project backend python backend/manage.py makemigrations --check
      - name: Fetch pinned tokenizer data
        run: uv run --project backend python backend/fetch_tokenizer.py
      - name: Backend analytics contracts and access tests
        run: uv run --project backend python backend/manage.py test api.tests_analytics api.tests_provider_urls api.tests_qwen_context
      - name: Production security settings
        run: uv run --project backend python ops/check_deployment.py
      - name: Dependency audit
        run: |
          npm --prefix frontend audit --audit-level=high
          pipx run --spec pip-audit==2.9.0 pip-audit --no-deps --disable-pip -r backend/requirements.txt
      - name: Compose configuration
        run: docker compose config --no-interpolate --quiet
