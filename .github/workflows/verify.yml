name: Platform verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Docker builds and configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed sources for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Build backend image
        run: docker build --tag mazory-backend:ci ./backend
      - name: Build frontend image and check TypeScript
        run: docker build --tag mazory-nginx:ci --file nginx/Dockerfile .
      - name: Django system check
        run: docker run --rm -e SECRET_KEY='ci-only-not-a-production-key-0123456789-abcdefghijklmnopqrstuvwxyz' mazory-backend:ci python manage.py check
      - name: Check migrations
        run: docker run --rm -e SECRET_KEY='ci-only-not-a-production-key-0123456789-abcdefghijklmnopqrstuvwxyz' mazory-backend:ci python manage.py makemigrations --check
      - name: Production settings check inside Docker
        run: docker run --rm -v "$PWD/ops:/checks:ro" --entrypoint python mazory-backend:ci /checks/check_deployment.py /app
      - name: Frontend dependency audit inside Docker
        run: docker run --rm -v "$PWD/frontend:/source:ro" --workdir /tmp/frontend node:22-alpine sh -c 'cp -R /source/. . && npm ci && npm run audit:security'
      - name: Backend dependency audit inside Docker
        run: docker run --rm --user 0 --entrypoint sh mazory-backend:ci -c 'pip install --no-cache-dir pip-audit==2.9.0 && pip-audit --no-deps --disable-pip -r /app/requirements.txt'
      - name: Compose configuration
        run: docker compose -f docker-compose.yml config --no-interpolate --quiet
