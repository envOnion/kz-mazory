[extend]
useDefault = true
[allowlist]
description = "Generated dependencies, repository internals and exact Django migration dependency tuples and pinned public tokenizer SHA-256 checksums"
paths = ['''(^|/)(node_modules|\.venv|\.git|dist)/''']
regexTarget = "line"
regexes = [
    '''^\s*"tokenizer\.json": "623c34567aebb18582765289fbe23d901c62704d6518d71866e0e58db892b5b7",?\s*$''',
    '''^\s*"tokenizer_config\.json": "10f93eabcb9b1602fbb991d6308e787ce1df28ee9cd7a1c6d1e8c3f338b957bc",?\s*$''',
    '''^\s*"tokenizer\.json": "0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3",?\s*$''',
    '''^\s*"tokenizer_config\.json": "b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27",?\s*$''',
'''\("api", "[0-9]{4}_[a-z0-9_]+"\)''']
