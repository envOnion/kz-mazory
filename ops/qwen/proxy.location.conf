# Included within the existing authenticated ai.kk-minsk.by server block.
location ^~ /qwen/ {
    client_max_body_size 64m;
    if ($auth_ok = 0) {
        add_header Content-Type 'application/json' always;
        return 401 '{"error":{"message":"Invalid or missing API key","type":"invalid_request_error","code":"invalid_api_key"}}';
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qwen_backend mazory-qwen:8080;
    rewrite ^/qwen/(.*)$ /$1 break;
    proxy_pass http://$qwen_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    chunked_transfer_encoding on;
}
