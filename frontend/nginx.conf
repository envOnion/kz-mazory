limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
    listen 8080;
    server_name _;
    # The backend and this proxy are private. The TLS edge overwrites X-Real-IP.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
    location /static/ { alias /staticfiles/; }
    location /media/ { return 404; }
    location /private-media/ { return 404; }
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        proxy_pass http://backend:8000;
    }
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000;
    }
}
