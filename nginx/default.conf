limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # TLS terminates at the host nginx. Keep redirects relative so this
    # container can never leak its internal HTTP scheme or port.
    absolute_redirect off;
    port_in_redirect off;

    # The gateway is published only on loopback. Docker forwards host traffic
    # from its private address range, carrying the client IP set by host nginx.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    # The host nginx redirects public HTTP before proxying here. Do not accept
    # client-supplied forwarded scheme/port headers at this trust boundary.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_redirect off;

    location = /admin {
        return 308 /admin/;
    }

    location = /api {
        return 308 /api/;
    }

    location = /static {
        return 308 /static/;
    }

    location /static/ {
        alias /staticfiles/;
    }

    location = /media {
        return 404;
    }

    location ^~ /media/ {
        return 404;
    }

    location = /private-media {
        return 404;
    }

    location ^~ /private-media/ {
        return 404;
    }

    location = /api/auth {
        return 308 /api/auth/;
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/mcp/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        client_max_body_size 21m;
        proxy_pass http://backend:8000;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
